services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: riki
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: arman_development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arman_development_postgres:/var/lib/postgresql/data

volumes:
  arman_development_postgres:
